<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>វិទ្យុទាក់ទង & ប្រកាសសំឡេង (ទូរស័ព្ទ & កុំព្យូទ័រ)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kantumruy Pro', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            padding: 24px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            border: 1px solid #334155;
        }
        h2 {
            color: #38bdf8;
            margin: 0 0 6px 0;
            font-size: 21px;
        }
        .sub {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 16px;
        }
        .card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 16px;
            margin-top: 12px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 12px;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button.action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: #0284c7;
            color: white;
            transition: 0.2s;
        }
        button.action-btn:hover {
            background: #0369a1;
        }
        .btn-connect {
            padding: 0 16px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-connect:hover {
            background: #15803d;
        }
        .btn-talk {
            width: 150px;
            height: 150px;
            border-radius: 75px;
            border: none;
            background: #ef4444;
            color: white;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.35);
            cursor: pointer;
            user-select: none;
            margin: 18px auto 8px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: transform 0.06s, background-color 0.2s;
        }
        .btn-talk.speaking {
            background: #22c55e !important;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.45);
            transform: scale(0.95);
        }
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .status-off { background: #7f1d1d; color: #fca5a5; }
        .status-on { background: #14532d; color: #86efac; }
        .peer-list {
            font-size: 13px;
            color: #cbd5e1;
            margin-top: 8px;
        }
        .peer-tag {
            display: inline-block;
            background: #1e293b;
            border: 1px solid #475569;
            padding: 3px 8px;
            border-radius: 6px;
            margin: 2px;
        }
        .log-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            height: 95px;
            overflow-y: auto;
            font-size: 12px;
            text-align: left;
            color: #94a3b8;
            margin-top: 12px;
        }
        #audioContainer {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✈️ ប្រព័ន្ធវិទ្យុទាក់ទង & ប្រកាស</h2>
    <div class="sub">ប្រើបានទាំងទូរស័ព្ទ និងកុំព្យូទ័រ (សំឡេងកណ្ដឹងព្រលានយន្តហោះ)</div>

    <!-- ជំហានទី ១៖ បញ្ចូល Username និង ID ផ្ទាល់ខ្លួន -->
    <div id="loginBox" class="card">
        <label>ឈ្មោះរបស់អ្នក (Username):</label>
        <input type="text" id="usernameInput" placeholder="ឧទាហរណ៍៖ ប្រធានក្លឹប / Dara">

        <label>ID ផ្ទាល់ខ្លួនរបស់អ្នក (អក្សរអង់គ្លេស/លេខ គ្មានដកឃ្លា):</label>
        <input type="text" id="myIdInput" placeholder="ឧទាហរណ៍៖ mic01 ឬ room1">

        <button class="action-btn" onclick="startSystem()">🚀 ចូលប្រើប្រព័ន្ធ</button>
    </div>

    <!-- ជំហានទី ២៖ តភ្ជាប់ និងនិយាយ -->
    <div id="radioBox" style="display: none;">
        <div id="myInfo" style="font-size: 13px; color: #7dd3fc; margin-bottom: 6px;"></div>
        <div id="connectionStatus" class="status-badge status-off">មិនទាន់តភ្ជាប់ជាមួយអ្នកផ្សេង</div>

        <div class="card">
            <label>បញ្ចូល ID ឧបករណ៍ដែលចង់តភ្ជាប់ (ទូរស័ព្ទ ឬ PC):</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="targetIdInput" placeholder="ឧទាហរណ៍៖ speaker01" style="margin-bottom: 0;">
                <button class="btn-connect" onclick="connectToPeer()">ភ្ជាប់</button>
            </div>
            <div class="peer-list">
                ឧបករណ៍ដែលបានភ្ជាប់៖ <span id="connectedPeers"><i style="color:#64748b;">គ្មាន</i></span>
            </div>
        </div>

        <div style="text-align: center;">
            <button id="talkBtn" class="btn-talk"
                    onmousedown="startSpeech(event)" onmouseup="stopSpeech(event)" onmouseleave="stopSpeech(event)"
                    ontouchstart="startSpeech(event)" ontouchend="stopSpeech(event)" ontouchcancel="stopSpeech(event)">
                ✈️ ចុចប្រកាស<br><span style="font-size: 11px; font-weight: normal;">(Hold to Talk)</span>
            </button>
            <div style="font-size: 12px; color: #94a3b8;">
                ចុចប៊ូតុងឱ្យជាប់ (ឬចុច Spacebar លើកុំព្យូទ័រ) ដើម្បីនិយាយ
            </div>
        </div>

        <div class="log-box" id="logBox">[ប្រព័ន្ធ]: កំពុងត្រៀម...</div>
    </div>
</div>

<div id="audioContainer"></div>

<script>
    let peer = null;
    let rawMicStream = null;
    let broadcastStream = null;
    let audioCtx = null;
    let chimeDestination = null;
    let username = '';
    let myId = '';
    let isSpeaking = false;
    const callsMap = new Map(); // រក្សាការហៅច្រើនឧបករណ៍

    const peerConfig = {
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' }
            ]
        }
    };

    function addLog(msg) {
        const logBox = document.getElementById('logBox');
        const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
        logBox.innerHTML += `<br>[${time}] ${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updatePeersUI() {
        const el = document.getElementById('connectedPeers');
        const statusEl = document.getElementById('connectionStatus');
        const ids = Array.from(callsMap.keys());

        if (ids.length === 0) {
            el.innerHTML = '<i style="color:#64748b;">គ្មាន</i>';
            statusEl.innerText = 'មិនទាន់តភ្ជាប់ជាមួយអ្នកផ្សេង';
            statusEl.className = 'status-badge status-off';
        } else {
            el.innerHTML = ids.map(id => `<span class="peer-tag">🟢 ${id}</span>`).join('');
            statusEl.innerText = `បានតភ្ជាប់ ${ids.length} ឧបករណ៍ (អាចនិយាយឆ្លើយឆ្លងបាន)`;
            statusEl.className = 'status-badge status-on';
        }
    }

    function setupAudioPipeline(micStream) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        const micSource = audioCtx.createMediaStreamSource(micStream);
        chimeDestination = audioCtx.createMediaStreamDestination();

        // បញ្ជូនសំឡេងមីក្រូហ្វូនទៅ Stream សម្រាប់ផ្សាយ
        micSource.connect(chimeDestination);
        broadcastStream = chimeDestination.stream;
    }

    function playAirportChime() {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const notes = [
            { freq: 659.25, start: 0,    duration: 0.35 },
            { freq: 523.25, start: 0.28, duration: 0.35 },
            { freq: 783.99, start: 0.56, duration: 0.35 },
            { freq: 659.25, start: 0.84, duration: 0.65 }
        ];

        const now = audioCtx.currentTime;

        notes.forEach(note => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(note.freq, now + note.start);

            gain.gain.setValueAtTime(0.001, now + note.start);
            gain.gain.exponentialRampToValueAtTime(0.25, now + note.start + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + note.start + note.duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (chimeDestination) {
                gain.connect(chimeDestination);
            }

            osc.start(now + note.start);
            osc.stop(now + note.start + note.duration + 0.05);
        });
    }

    async function startSystem() {
        username = document.getElementById('usernameInput').value.trim();
        myId = document.getElementById('myIdInput').value.trim().replace(/\s+/g, '');

        if (!username || !myId) {
            alert('សូមបញ្ចូល Username និង ID ផ្ទាល់ខ្លួនឱ្យបានត្រឹមត្រូវ!');
            return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert('Browser នេះមិនគាំទ្រមីក្រូហ្វូនទេ ឬសូមបើកតាម HTTPS / localhost។');
            return;
        }

        try {
            rawMicStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                video: false
            });
            rawMicStream.getAudioTracks()[0].enabled = false;
            setupAudioPipeline(rawMicStream);

            peer = new Peer(myId, peerConfig);

            peer.on('open', (id) => {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('radioBox').style.display = 'block';
                document.getElementById('myInfo').innerText = `អ្នកកំពុងប្រើជា៖ ${username} | ID របស់អ្នក៖ ${id}`;
                addLog(`ចូលប្រព័ន្ធបានជោគជ័យ (ID: ${id})`);
            });

            peer.on('call', (call) => {
                addLog(`ទទួលការហៅពី ID: ${call.peer}`);
                call.answer(broadcastStream);
                registerCall(call);
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert('ID នេះកំពុងត្រូវបានប្រើប្រាស់រួចហើយ! សូមដាក់ ID ផ្សេង។');
                } else if (err.type === 'peer-unavailable') {
                    addLog('មិនឃើញ ID អ្នកទទួលដែលបានបញ្ចូល (ត្រូវប្រាកដថាគាត់បានចូលប្រព័ន្ធរួចហើយ)។');
                } else {
                    addLog('កំហុសតភ្ជាប់៖ ' + err.type);
                }
            });

        } catch (err) {
            alert('មិនអាចបើកមីក្រូហ្វូនបានទេ៖ ' + err.message);
        }
    }

    function connectToPeer() {
        const targetId = document.getElementById('targetIdInput').value.trim().replace(/\s+/g, '');
        if (!targetId) {
            alert('សូមបញ្ចូល ID របស់ឧបករណ៍ដែលចង់ភ្ជាប់!');
            return;
        }
        if (targetId === myId) {
            alert('អ្នកមិនអាចបញ្ចូល ID ផ្ទាល់ខ្លួនរបស់អ្នកបានទេ!');
            return;
        }
        if (!peer || !broadcastStream) {
            alert('ប្រព័ន្ធមិនទាន់រួចរាល់ទេ។');
            return;
        }

        addLog(`កំពុងហៅភ្ជាប់ទៅកាន់ ID: ${targetId}...`);
        const call = peer.call(targetId, broadcastStream);
        if (call) {
            registerCall(call);
        }
        document.getElementById('targetIdInput').value = '';
    }

    function registerCall(call) {
        const remoteId = call.peer;
        callsMap.set(remoteId, call);
        updatePeersUI();

        call.on('stream', (remoteStream) => {
            let audioEl = document.getElementById('audio_' + remoteId);
            if (!audioEl) {
                audioEl = document.createElement('audio');
                audioEl.id = 'audio_' + remoteId;
                audioEl.autoplay = true;
                audioEl.playsInline = true;
                document.getElementById('audioContainer').appendChild(audioEl);
            }
            audioEl.srcObject = remoteStream;
            audioEl.play().catch(() => {});
            addLog(`បានភ្ជាប់សំឡេងជាមួយ ${remoteId} រួចរាល់!`);
            updatePeersUI();
        });

        call.on('close', () => {
            callsMap.delete(remoteId);
            const audioEl = document.getElementById('audio_' + remoteId);
            if (audioEl) audioEl.remove();
            addLog(`បានផ្ដាច់ការតភ្ជាប់ជាមួយ ${remoteId}`);
            updatePeersUI();
        });

        call.on('error', () => {
            addLog(`បរាជ័យក្នុងការតភ្ជាប់ជាមួយ ${remoteId}`);
        });
    }

    function startSpeech(e) {
        if (e && e.cancelable) e.preventDefault();
        if (!rawMicStream || isSpeaking) return;

        isSpeaking = true;
        playAirportChime();

        setTimeout(() => {
            if (isSpeaking && rawMicStream) {
                rawMicStream.getAudioTracks()[0].enabled = true;
            }
        }, 900);

        const btn = document.getElementById('talkBtn');
        btn.classList.add('speaking');
        btn.innerHTML = '🔊 កំពុងប្រកាស...';
    }

    function stopSpeech(e) {
        if (e && e.cancelable) e.preventDefault();
        if (!rawMicStream || !isSpeaking) return;

        isSpeaking = false;
        rawMicStream.getAudioTracks()[0].enabled = false;

        if (audioCtx) {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (chimeDestination) gain.connect(chimeDestination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        const btn = document.getElementById('talkBtn');
        btn.classList.remove('speaking');
        btn.innerHTML = '✈️ ចុចប្រកាស<br><span style="font-size: 11px; font-weight: normal;">(Hold to Talk)</span>';
    }

    // គាំទ្រ Spacebar លើកុំព្យូទ័រ
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && document.getElementById('radioBox').style.display !== 'none' && document.activeElement.tagName !== 'INPUT') {
            e.preventDefault();
            startSpeech();
        }
    });

    document.addEventListener('keyup', (e) => {
        if (e.code === 'Space' && document.getElementById('radioBox').style.display !== 'none' && document.activeElement.tagName !== 'INPUT') {
            e.preventDefault();
            stopSpeech();
        }
    });
</script>

</body>
</html>
